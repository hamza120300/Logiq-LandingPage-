          return 'ar';

        const dir = lang === 'ar' ? 'rtl' : 'ltr';

        const toggleLang = () => {
          const next = lang === 'ar' ? 'en' : 'ar';
          setLang(next);
          try { localStorage.setItem('logiq_lang', next); } catch (e) {}
        };

        useEffect(() => {
          document.documentElement.setAttribute('dir', dir);
          document.documentElement.setAttribute('lang', lang);
          if (lang === 'ar') {
            document.body.classList.add('font-arabic');
            document.body.classList.remove('font-sans');
          } else {
            document.body.classList.add('font-sans');
            document.body.classList.remove('font-arabic');

        return (

        };

        return (
          <div className="min-h-screen bg-[#07151E] text-slate-100 selection:bg-[#2BB8B3] selection:text-white" dir={dir}>
            <Navbar onOpenLogin={() => setIsLoginOpen(true)} onOpenContact={() => handleOpenContact()} />
            <main>
              <Hero onOpenContact={() => handleOpenContact()} />
              <Solutions onSelectSector={(id) => handleOpenContact(id)} />
              <Features />
              <HowItWorks />
              <WhyLogiq />
              <CTASection onOpenContact={() => handleOpenContact()} />
            </main>
            <Footer />
            <LoginModal isOpen={isLoginOpen} onClose={() => setIsLoginOpen(false)} />
            <ContactModal isOpen={isContactOpen} onClose={() => setIsContactOpen(false)} defaultSector={selectedSector} />
          </div>
        );
      };

      // Mount Application
      ReactDOM.createRoot(document.getElementById('root')).render(
        <LanguageProvider>
          <App />
        </LanguageProvider>
      );
    </script>
  </body>
</html>
